<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="600">
  <title>Kindle Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Kindle 7th Gen rotated container scaled to 625px height */
    .rotate-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 730px;
      height: 625px;
      transform: rotate(-90deg) translateX(-100%);
      -webkit-transform: rotate(-90deg) translateX(-100%);
      transform-origin: top left;
      -webkit-transform-origin: top left;
      padding: 16px 24px 8px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    /* Top Section: Time & Date */
    .top-section {
      text-align: center;
      width: 100%;
      padding-top: 4px;
    }
    .clock-container {
      display: inline-block;
      line-height: 0.9;
      white-space: nowrap;
    }
    .time-digits {
      font-size: 148px;
      font-weight: 800;
      letter-spacing: -4px;
    }
    .time-period {
      font-size: 68px;
      font-weight: 800;
      margin-left: 6px;
      vertical-align: baseline;
    }
    .date-display {
      font-size: 26px;
      font-weight: 700;
      margin-top: 8px;
      color: #111111;
    }

    /* Horizontal Divider */
    hr {
      border: 0;
      border-top: 2px solid #000000;
      margin: 12px 0 10px 0;
      width: 100%;
    }

    /* Middle Section: Current Weather */
    .current-weather {
      width: 100%;
      display: table;
      table-layout: fixed;
      margin-bottom: 8px;
    }
    .weather-left {
      display: table-cell;
      vertical-align: middle;
      width: 58%;
      text-align: left;
    }
    .location-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .weather-details {
      font-size: 20px;
      line-height: 1.35;
      font-weight: 700;
      white-space: nowrap;
    }

    .weather-right {
      display: table-cell;
      vertical-align: middle;
      width: 42%;
      text-align: right;
      white-space: nowrap;
    }
    .temp-large {
      font-size: 96px;
      font-weight: 800;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
      margin-right: 14px;
    }
    .icon-container {
      display: inline-block;
      vertical-align: middle;
      width: 80px;
      height: 80px;
    }
    .icon-container svg {
      width: 100%;
      height: 100%;
      stroke: #000;
      stroke-width: 2.3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Bottom Section: 5-Day Forecast Strip */
    .forecast-container {
      display: table;
      width: 100%;
      table-layout: fixed;
      border: 2px solid #000000;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .forecast-col {
      display: table-cell;
      text-align: center;
      vertical-align: middle;
      padding: 16px 4px 14px 4px;
      border-right: 1px solid #000000;
    }
    .forecast-col:last-child {
      border-right: none;
    }
    .fc-day {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .fc-icon {
      width: 50px;
      height: 50px;
      margin: 0 auto 8px auto;
    }
    .fc-icon svg {
      width: 100%;
      height: 100%;
      stroke: #000;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fc-temps {
      font-size: 19px;
      font-weight: 800;
      white-space: nowrap;
    }
    .fc-desc {
      font-size: 14px;
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #333333;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>

  <div class="rotate-wrapper">
    <div class="top-section">
      <div class="clock-container">
        <span id="time" class="time-digits">--:--</span>
        <span id="period" class="time-period">--</span>
      </div>
      <div id="date" class="date-display">Loading date...</div>
    </div>

    <hr>

    <div class="current-weather">
      <div class="weather-left">
        <div id="location" class="location-title">Barnet, UK</div>
        <div id="condition" class="weather-details">Loading weather...</div>
        <div id="subdetails" class="weather-details">Wind: -- km/h · Humidity: --%</div>
      </div>
      <div class="weather-right">
        <span id="temp-display" class="temp-large">--°</span>
        <span id="weather-icon" class="icon-container"></span>
      </div>
    </div>

    <div id="forecast-strip" class="forecast-container">
      <!-- Injected by JavaScript -->
    </div>

    <div id="footer" class="footer">Last Refreshed: --:--</div>
  </div>

  <script>
    var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var shortDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    function isBritishSummerTime(d) {
      var year = d.getUTCFullYear();
      var marchLast = new Date(Date.UTC(year, 2, 31));
      var bstStart = new Date(Date.UTC(year, 2, 31 - marchLast.getUTCDay(), 1, 0, 0));
      var octLast = new Date(Date.UTC(year, 9, 31));
      var bstEnd = new Date(Date.UTC(year, 9, 31 - octLast.getUTCDay(), 1, 0, 0));
      return d >= bstStart && d < bstEnd;
    }

    function updateClock() {
      var utcNow = new Date();
      var offsetHours = isBritishSummerTime(utcNow) ? 1 : 0;
      var now = new Date(utcNow.getTime() + (offsetHours * 3600000));

      var hours = now.getUTCHours();
      var minutes = now.getUTCMinutes();
      var period = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;
      minutes = ('0' + minutes).slice(-2);

      document.getElementById('time').innerHTML = hours + ':' + minutes;
      document.getElementById('period').innerHTML = period;

      var dayName = days[now.getUTCDay()];
      var monthName = months[now.getUTCMonth()];
      var dayNum = now.getUTCDate();
      var fullYear = now.getUTCFullYear();

      document.getElementById('date').innerHTML = dayName + ', ' + monthName + ' ' + dayNum + ', ' + fullYear;
    }

    var icons = {
      sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m14.14-14.14l-1.41 1.41"/></svg>',
      cloud: '<svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
      rain: '<svg viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6m-8-6v6m-4-4v4m8-2v4"/></svg>'
    };

    function parseWmoCode(code) {
      if (code === 0) return { desc: 'Clear sky', icon: icons.sun };
      if (code >= 1 && code <= 3) return { desc: 'Few clouds', icon: icons.cloud };
      if (code >= 45 && code <= 48) return { desc: 'Foggy', icon: icons.cloud };
      if (code >= 51 && code <= 67) return { desc: 'Showers', icon: icons.rain };
      if (code >= 80 && code <= 82) return { desc: 'Rain', icon: icons.rain };
      return { desc: 'Overcast', icon: icons.cloud };
    }

    function fetchWeather() {
      var lat = 51.65;
      var lon = -0.20;
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + 
                '&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m' +
                '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            
            var current = data.current;
            var temp = Math.round(current.temperature_2m);
            var weatherInfo = parseWmoCode(current.weather_code);
            var precip = current.precipitation;
            var humidity = current.relative_humidity_2m;
            var wind = Math.round(current.wind_speed_10m);

            document.getElementById('location').innerHTML = 'Barnet, UK';
            document.getElementById('condition').innerHTML = weatherInfo.desc + ' · Precip: ' + precip + 'mm';
            document.getElementById('subdetails').innerHTML = 'Wind: ' + wind + ' km/h · Humidity: ' + humidity + '%';
            document.getElementById('temp-display').innerHTML = temp + '°';
            document.getElementById('weather-icon').innerHTML = weatherInfo.icon;

            var daily = data.daily;
            var forecastHtml = '';
            for (var i = 0; i < 5; i++) {
              var dateParts = daily.time[i].split('-');
              var dayObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
              var dayTitle = i === 0 ? 'Today' : shortDays[dayObj.getDay()];
              var dayInfo = parseWmoCode(daily.weather_code[i]);
              var maxT = Math.round(daily.temperature_2m_max[i]);
              var minT = Math.round(daily.temperature_2m_min[i]);

              forecastHtml += '<div class="forecast-col">' +
                '<div class="fc-day">' + dayTitle + '</div>' +
                '<div class="fc-icon">' + dayInfo.icon + '</div>' +
                '<div class="fc-temps">' + maxT + '° / ' + minT + '°</div>' +
                '<div class="fc-desc">' + dayInfo.desc + '</div>' +
              '</div>';
            }
            document.getElementById('forecast-strip').innerHTML = forecastHtml;

            var utcNow = new Date();
            var offset = isBritishSummerTime(utcNow) ? 1 : 0;
            var localNow = new Date(utcNow.getTime() + (offset * 3600000));
            var h = ('0' + localNow.getUTCHours()).slice(-2);
            var m = ('0' + localNow.getUTCMinutes()).slice(-2);
            document.getElementById('footer').innerHTML = 'Last Refreshed: ' + h + ':' + m;
          } catch (e) {}
        }
      };
      xhr.send();
    }

    updateClock();
    setInterval(updateClock, 1000);
    fetchWeather();
  </script>
</body>
</html>
