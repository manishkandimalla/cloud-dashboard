<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="600">
  <title>Kindle Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fixed rotation container scaled to 715px width */
    .rotate-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 715px;
      height: 600px;
      transform: rotate(-90deg) translateX(-100%);
      -webkit-transform: rotate(-90deg) translateX(-100%);
      transform-origin: top left;
      -webkit-transform-origin: top left;
      padding: 20px 24px 16px 24px;
    }
    
    /* Top Section: Time & Date */
    .top-section {
      text-align: center;
      width: 100%;
      margin-top: 4px;
    }
    .clock-container {
      display: inline-block;
      line-height: 0.92;
      white-space: nowrap;
    }
    .time-digits {
      font-size: 155px;
      font-weight: 800;
      letter-spacing: -3px;
    }
    .time-period {
      font-size: 72px;
      font-weight: 800;
      margin-left: 8px;
      vertical-align: baseline;
    }
    .date-display {
      font-size: 30px;
      font-weight: 700;
      margin-top: 10px;
      color: #000000;
    }

    /* Horizontal Divider */
    hr {
      border: 0;
      border-top: 3px solid #000000;
      margin: 22px 0 24px 0;
      width: 100%;
    }

    /* Weather Section */
    .current-weather {
      width: 100%;
      display: table;
      table-layout: fixed;
    }
    .weather-left {
      display: table-cell;
      vertical-align: middle;
      width: 62%;
      text-align: left;
    }
    .location-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      white-space: nowrap;
    }
    .weather-details {
      font-size: 24px;
      line-height: 1.35;
      font-weight: 700;
      white-space: nowrap;
    }

    .weather-right {
      display: table-cell;
      vertical-align: middle;
      width: 38%;
      text-align: right;
      white-space: nowrap;
    }
    .temp-large {
      font-size: 115px;
      font-weight: 800;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
      margin-right: 14px;
    }
    .icon-container {
      display: inline-block;
      vertical-align: middle;
      width: 90px;
      height: 90px;
    }
    .icon-container svg {
      width: 100%;
      height: 100%;
      stroke: #000;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Footer pinned cleanly at the bottom */
    .footer {
      position: absolute;
      bottom: 16px;
      left: 0;
      width: 715px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #111111;
    }
  </style>
</head>
<body>

  <div class="rotate-wrapper">
    <!-- Top: Time & Date -->
    <div class="top-section">
      <div class="clock-container">
        <span id="time" class="time-digits">--:--</span>
        <span id="period" class="time-period">--</span>
      </div>
      <div id="date" class="date-display">Loading date...</div>
    </div>

    <hr>

    <!-- Bottom: Current Weather -->
    <div class="current-weather">
      <div class="weather-left">
        <div id="location" class="location-title">Barnet, UK</div>
        <div id="condition" class="weather-details">Loading...</div>
        <div id="precip" class="weather-details">precip: --mm</div>
        <div id="wind" class="weather-details">wind: -- km/h</div>
        <div id="humidity" class="weather-details">humidity --%</div>
      </div>
      <div class="weather-right">
        <span id="temp-display" class="temp-large">--°</span>
        <span id="weather-icon" class="icon-container"></span>
      </div>
    </div>

    <div id="footer" class="footer">Last Refreshed: --:--</div>
  </div>

  <script>
    var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    function isBritishSummerTime(d) {
      var year = d.getUTCFullYear();
      var marchLast = new Date(Date.UTC(year, 2, 31));
      var bstStart = new Date(Date.UTC(year, 2, 31 - marchLast.getUTCDay(), 1, 0, 0));
      var octLast = new Date(Date.UTC(year, 9, 31));
      var bstEnd = new Date(Date.UTC(year, 9, 31 - octLast.getUTCDay(), 1, 0, 0));
      return d >= bstStart && d < bstEnd;
    }

    function updateClock() {
      var utcNow = new Date();
      var offsetHours = isBritishSummerTime(utcNow) ? 1 : 0;
      var now = new Date(utcNow.getTime() + (offsetHours * 3600000));

      var hours = now.getUTCHours();
      var minutes = now.getUTCMinutes();
      var period = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;
      minutes = ('0' + minutes).slice(-2);

      document.getElementById('time').innerHTML = hours + ':' + minutes;
      document.getElementById('period').innerHTML = period;

      var dayName = days[now.getUTCDay()];
      var monthName = months[now.getUTCMonth()];
      var dayNum = now.getUTCDate();
      var fullYear = now.getUTCFullYear();

      document.getElementById('date').innerHTML = dayName + ', ' + monthName + ' ' + dayNum + ', ' + fullYear;
    }

    var icons = {
      sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m14.14-14.14l-1.41 1.41"/></svg>',
      cloud: '<svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
      rain: '<svg viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6m-8-6v6m-4-4v4m8-2v4"/></svg>'
    };

    function parseWmoCode(code) {
      if (code === 0) return { desc: 'clear sky', icon: icons.sun };
      if (code >= 1 && code <= 3) return { desc: 'few clouds', icon: icons.cloud };
      if (code >= 45 && code <= 48) return { desc: 'foggy', icon: icons.cloud };
      if (code >= 51 && code <= 67) return { desc: 'showers', icon: icons.rain };
      if (code >= 80 && code <= 82) return { desc: 'rain', icon: icons.rain };
      return { desc: 'overcast', icon: icons.cloud };
    }

    function fetchWeather() {
      var lat = 51.65;
      var lon = -0.20;
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + 
                '&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&timezone=auto';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            var current = data.current;
            var temp = Math.round(current.temperature_2m);
            var weatherInfo = parseWmoCode(current.weather_code);
            var precip = current.precipitation;
            var humidity = current.relative_humidity_2m;
            var wind = Math.round(current.wind_speed_10m);

            document.getElementById('location').innerHTML = 'Barnet, UK';
            document.getElementById('condition').innerHTML = weatherInfo.desc;
            document.getElementById('precip').innerHTML = 'precip: ' + precip + 'mm';
            document.getElementById('wind').innerHTML = 'wind: ' + wind + ' km/h';
            document.getElementById('humidity').innerHTML = 'humidity: ' + humidity + '%';
            document.getElementById('temp-display').innerHTML = temp + '°';
            document.getElementById('weather-icon').innerHTML = weatherInfo.icon;

            var utcNow = new Date();
            var offset = isBritishSummerTime(utcNow) ? 1 : 0;
            var localNow = new Date(utcNow.getTime() + (offset * 3600000));
            var h = ('0' + localNow.getUTCHours()).slice(-2);
            var m = ('0' + localNow.getUTCMinutes()).slice(-2);
            document.getElementById('footer').innerHTML = 'Last Refreshed: ' + h + ':' + m;
          } catch (e) {}
        }
      };
      xhr.send();
    }

    updateClock();
    setInterval(updateClock, 1000);
    fetchWeather();
  </script>
</body>
</html>
